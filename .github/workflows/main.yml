name: Deploy App

on:
  push:
    branches:
      - Main_v1

env:
  WDCLI_CLIENT_ID: ${{ secrets.WDCLI_CLIENT_ID }}
  WDCLI_CLIENT_SECRET: ${{ secrets.WDCLI_CLIENT_SECRET }}
  WDCLI_TENANT_CLIENT_ID: ${{ secrets.WDCLI_TENANT_CLIENT_ID }}
  WDCLI_TENANT_CLIENT_SECRET: ${{ secrets.WDCLI_TENANT_CLIENT_SECRET }}
  WDCLI_TENANT_ALIAS: elara4
  WDCLI_APP_REFERENCE_ID: learningEnrollmentsInboundZtnmytq_1_zgjwvs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Setup WDCLI
        run: |
          tar -xzf wdcli-installer-linux-x64-v1.9.43.tar.gz
          echo "$PWD/wdcli/bin" >> $GITHUB_PATH

    
      - name: Authenticate with System User
        run: |
          wdcli auth login --system-user
      - name: Verify WDCLI Installation
        run: |
          wdcli version
          wdcli tenant list

      - name: Upload App
        run: |
          wdcli app upload $WDCLI_APP_REFERENCE_ID --ci

      - name: Promote App to Production
        run: |
          wdcli app promote $WDCLI_APP_REFERENCE_ID \
            --latest-version \
            --target-promotion-level implementation \
            --release-notes "Automated deployment from GitHub Actions" \
            --ci

      - name: Get Tenant Access Token
        id: token
        run: |
          CREDENTIALS=$(printf '%s' "$WDCLI_TENANT_CLIENT_ID:$WDCLI_TENANT_CLIENT_SECRET" | base64 | tr -d '\n')

          RESPONSE=$(curl --fail-with-body -sS -X POST https://auth.api.workday.com/v1/token \
            -H "Authorization: Basic $CREDENTIALS" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&tenant_alias=$WDCLI_TENANT_ALIAS")

          echo "$RESPONSE"

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Set Tenant Access Token in Config
        run: |
          wdcli config set defaultTenantAlias $WDCLI_TENANT_ALIAS
          wdcli config set wcpTenantAccessToken ${{ steps.token.outputs.access_token }}

      - name: Deploy App
        run: |
          wdcli app deploy $WDCLI_APP_REFERENCE_ID \
            --latest-version \
            --ci \
            -t $WDCLI_TENANT_ALIAS
